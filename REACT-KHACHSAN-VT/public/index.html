    <script>
      // Optimized rotating favicon animation
      ;(function () {
        // Chỉ chạy animation khi tab đang active
        if (document.hidden) return

        const faviconPath = '/favicon.ico'
        const canvas = document.createElement('canvas')
        const ctx = canvas.getContext('2d')
        const img = new Image()
        let angle = 0
        let animationId = null
        const UPDATE_INTERVAL = 200 // Cập nhật mỗi 200ms để animation chậm hơn
        const ANGLE_INCREMENT = 3 // Quay 3 độ mỗi lần để animation mượt mà hơn

        img.onload = function () {
          canvas.width = img.width || 32
          canvas.height = img.height || 32

          function rotateFavicon() {
            // Kiểm tra nếu tab không active thì dừng animation
            if (document.hidden) {
              if (animationId) {
                clearTimeout(animationId)
                animationId = null
              }
              return
            }

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height)

            // Save context state
            ctx.save()

            // Move to center, rotate, then move back
            ctx.translate(canvas.width / 2, canvas.height / 2)
            ctx.rotate((angle * Math.PI) / 180)
            ctx.translate(-canvas.width / 2, -canvas.height / 2)

            // Draw the image
            ctx.drawImage(img, 0, 0)

            // Restore context state
            ctx.restore()

            // Update favicon
            const link = document.getElementById('favicon')
            if (link) {
              link.href = canvas.toDataURL('image/png')
            }

            // Increment angle với bước nhảy lớn hơn
            angle = (angle + ANGLE_INCREMENT) % 360

            // Sử dụng setTimeout thay vì requestAnimationFrame để giảm tần suất
            animationId = setTimeout(rotateFavicon, UPDATE_INTERVAL)
          }

          // Bắt đầu animation
          rotateFavicon()

          // Dừng animation khi tab không active
          document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
              if (animationId) {
                clearTimeout(animationId)
                animationId = null
              }
            } else {
              if (!animationId) {
                rotateFavicon()
              }
            }
          })
        }

        img.onerror = function () {
          // Nếu không load được favicon thì không chạy animation
          console.warn('Could not load favicon for animation')
        }

        img.src = faviconPath
      })()
    </script>
